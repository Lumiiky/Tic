<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pratique en cours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF3E0; color: #1F4D3A; font-family: 'Baloo 2', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 14px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <button aria-label="Quitter la session" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; color: #1F4D3A; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #F0DCC0; cursor: pointer; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
      <div style="height: 10px; border-radius: 5px; background: #1F4D3A"></div>
      <div style="height: 10px; border-radius: 5px; background: linear-gradient(90deg, #FF8A5B 55%, #F3DFC2 55%)"></div>
      <div style="height: 10px; border-radius: 5px; background: #F3DFC2"></div>
      <div style="height: 10px; border-radius: 5px; background: #F3DFC2"></div>
    </div>
  </div>

  <div>
    <div style="font-size: 15px; font-weight: 700; color: #B4441A">Étape 2 · Nouvelle partie</div>
    <h1 style="margin: 0; font-weight: 800; font-size: 28px; line-height: 1.1">Thème, variation</h1>
    <div style="font-size: 16px; font-weight: 600; color: #4E6E61">mesures 17–20 · main droite</div>
  </div>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 20px 14px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 3px 0 #F0DCC0">
    <svg viewBox="0 0 330 90" width="100%" role="img" aria-label="Portée : trois notes jouées juste, la quatrième à jouer maintenant">
      <g stroke="#1F4D3A" stroke-width="1" opacity="0.45">
        <line x1="0" y1="20" x2="330" y2="20"></line><line x1="0" y1="30" x2="330" y2="30"></line><line x1="0" y1="40" x2="330" y2="40"></line><line x1="0" y1="50" x2="330" y2="50"></line><line x1="0" y1="60" x2="330" y2="60"></line>
        <line x1="85" y1="20" x2="85" y2="60"></line><line x1="170" y1="20" x2="170" y2="60"></line><line x1="250" y1="20" x2="250" y2="60"></line><line x1="329" y1="20" x2="329" y2="60"></line>
      </g>
      <rect x="114" y="6" width="34" height="74" rx="10" fill="#FFE0CF"></rect>
      <g fill="#2E8A5C"><ellipse cx="22" cy="35" rx="6" ry="4.5" transform="rotate(-20 22 35)"></ellipse><line x1="27.5" y1="34" x2="27.5" y2="8" stroke="#2E8A5C" stroke-width="1.6"></line>
      <ellipse cx="58" cy="25" rx="6" ry="4.5" transform="rotate(-20 58 25)"></ellipse><line x1="63.5" y1="24" x2="63.5" y2="2" stroke="#2E8A5C" stroke-width="1.6"></line>
      <ellipse cx="100" cy="30" rx="6" ry="4.5" transform="rotate(-20 100 30)"></ellipse><line x1="105.5" y1="29" x2="105.5" y2="5" stroke="#2E8A5C" stroke-width="1.6"></line></g>
      <ellipse cx="131" cy="40" rx="7.5" ry="5.5" transform="rotate(-20 131 40)" fill="#E5683A"></ellipse><line x1="138" y1="39" x2="138" y2="12" stroke="#E5683A" stroke-width="2"></line>
      <g fill="#B9C4BE"><ellipse cx="200" cy="35" rx="6" ry="4.5" transform="rotate(-20 200 35)"></ellipse><line x1="205.5" y1="34" x2="205.5" y2="10" stroke="#B9C4BE" stroke-width="1.6"></line>
      <ellipse cx="230" cy="45" rx="6" ry="4.5" transform="rotate(-20 230 45)"></ellipse><line x1="235.5" y1="44" x2="235.5" y2="18" stroke="#B9C4BE" stroke-width="1.6"></line>
      <ellipse cx="290" cy="30" rx="6" ry="4.5" transform="rotate(-20 290 30)"></ellipse><line x1="295.5" y1="29" x2="295.5" y2="5" stroke="#B9C4BE" stroke-width="1.6"></line></g>
    </svg>
    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700">
      <span style="color: #2E7550">3 notes justes</span>
      <span style="color: #B4441A">À toi : Fa dièse</span>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 6px">
    <svg width="78" height="78" viewBox="0 0 200 200" role="img" aria-label="Tic, content" style="flex-shrink: 0">
      <path d="M58 162 L84 42 Q 86 36 92 36 L108 36 Q 114 36 116 42 L142 162 Q 143 168 136 168 L64 168 Q 57 168 58 162 Z" fill="#FF8A5B"></path>
      <rect x="62" y="148" width="76" height="20" rx="6" fill="#E5683A"></rect>
      <circle cx="90" cy="96" r="7" fill="#1F4D3A"></circle>
      <circle cx="110" cy="96" r="7" fill="#1F4D3A"></circle>
      <path d="M90 114 Q 100 124 110 114" fill="none" stroke="#1F4D3A" stroke-width="5" stroke-linecap="round"></path>
      <line x1="100" y1="148" x2="156" y2="62" stroke="#1F4D3A" stroke-width="8" stroke-linecap="round"></line>
    </svg>
    <div style="flex: 1; background: #1F4D3A; color: #FFF3E0; border-radius: 20px 20px 20px 6px; padding: 10px 14px; margin-bottom: 14px">
      <div style="font-weight: 800; font-size: 17px; line-height: 1.2">86 %, bien joué !</div>
      <div style="font-weight: 500; font-size: 14px; color: #CFE3D8; line-height: 1.3">Tu presses un peu mesure 18. Encore une validation.</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 2px 0 #F0DCC0">
      <div style="font-size: 14px; font-weight: 600; color: #4E6E61">Validations</div>
      <div style="display: flex; align-items: center; gap: 6px">
        <div style="width: 16px; height: 16px; border-radius: 8px; background: #FF8A5B"></div>
        <div style="width: 16px; height: 16px; border-radius: 8px; background: #FF8A5B"></div>
        <div style="width: 16px; height: 16px; border-radius: 8px; border: 2.5px solid #1F4D3A; box-sizing: border-box"></div>
        <span style="font-weight: 800; font-size: 18px; margin-left: 4px">2 / 3</span>
      </div>
    </div>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 8px 8px 8px 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 0 #F0DCC0">
      <div><div style="font-size: 14px; font-weight: 600; color: #4E6E61">Tempo</div><div style="font-weight: 800; font-size: 18px; line-height: 1.1">43 bpm</div></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <button aria-label="Accélérer" style="width: 44px; height: 26px; border-radius: 8px; border: none; background: #F3DFC2; color: #1F4D3A; font-weight: 800; font-size: 16px; cursor: pointer">+</button>
        <button aria-label="Ralentir" style="width: 44px; height: 26px; border-radius: 8px; border: none; background: #F3DFC2; color: #1F4D3A; font-weight: 800; font-size: 16px; cursor: pointer">−</button>
      </div>
    </div>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: #4E6E61">
    <div style="width: 9px; height: 9px; border-radius: 5px; background: #2E8A5C"></div>
    Clavier MIDI connecté
  </div>

  <div style="display: flex; gap: 10px">
    <button style="flex: 1; min-height: 58px; border-radius: 20px; border: none; background: #FFFFFF; color: #1F4D3A; font-family: inherit; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 0 #F0DCC0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
      Écouter
    </button>
    <button style="flex: 1.4; min-height: 58px; border-radius: 20px; border: none; background: #1F4D3A; color: #FFF3E0; font-family: inherit; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 0 #133326">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"></path></svg>
      Rejouer
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
