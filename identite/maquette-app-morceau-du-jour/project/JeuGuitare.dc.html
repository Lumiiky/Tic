<div style="width: 844px; height: 390px; box-sizing: border-box; background: #FFF3E0; color: #1F4D3A; font-family: 'Baloo 2', sans-serif; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">

        <text x="171" y="100" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="14" text-anchor="middle" fill="#2A2140">Juste !</text>

          <line x1="80" y1="48" x2="72" y2="42"></line>
          <line x1="140" y1="48" x2="148" y2="42"></line>

    </div>

            <text x="87" y="39">1</text><text x="51" y="61">2</text><text x="69" y="61">3</text>
          </g>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-weight: 800; font-size: 26px; line-height: 1">Am</div>
          <div style="font-size: 13px; font-weight: 600; color: #4E6E61; line-height: 1.3">La mineur<br>3 doigts</div>
        </div>
      </div>

      <div style="background: #FFFFFF; border-radius: 18px; padding: 6px 6px 6px 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 0 #F0DCC0">
        <div><div style="font-size: 12px; font-weight: 600; color: #4E6E61">Tempo</div><div style="font-weight: 800; font-size: 16px; line-height: 1.1">70 %</div></div>
        <div style="display: flex; gap: 4px">
          <button aria-label="Ralentir" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #F3DFC2; color: #1F4D3A; font-weight: 800; font-size: 18px; cursor: pointer">−</button>
          <button aria-label="Accélérer" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #F3DFC2; color: #1F4D3A; font-weight: 800; font-size: 18px; cursor: pointer">+</button>
        </div>
      </div>

</div>
