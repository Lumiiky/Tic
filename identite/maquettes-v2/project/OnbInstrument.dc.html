<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ton instrument</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F4D3A}a:hover{color:#133326}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF3E0; color: #1F4D3A; font-family: 'Baloo 2', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 16px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="OnbProfil.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #F0DCC0; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px" role="img" aria-label="Étape 2 sur 6">
      <div style="height: 8px; border-radius: 4px; background: #FF8A5B"></div><div style="height: 8px; border-radius: 4px; background: #FF8A5B"></div><div style="height: 8px; border-radius: 4px; background: #F3DFC2"></div><div style="height: 8px; border-radius: 4px; background: #F3DFC2"></div><div style="height: 8px; border-radius: 4px; background: #F3DFC2"></div><div style="height: 8px; border-radius: 4px; background: #F3DFC2"></div>
    </div>
  </div>

  <div>
    <h1 style="margin: 0; font-weight: 800; font-size: 32px; line-height: 1.08">Sur quoi tu joues ?</h1>
    <div style="font-size: 16px; font-weight: 600; color: #46655A; margin-top: 4px">Je t'écoute avec le micro du téléphone, au piano comme à la guitare.</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px" role="radiogroup" aria-label="Ton instrument">
    <sc-for list="{{ instruments }}" as="ins" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{ ins.checked }}" onClick="{{ ins.pick }}" style="{{ ins.style }}">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1F4D3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ ins.icon }}"></path></svg>
        <span style="font-weight: 800; font-size: 17px; line-height: 1.15">{{ ins.label }}</span>
        <span style="font-weight: 600; font-size: 13px; color: #46655A; line-height: 1.2">{{ ins.hint }}</span>
      </button>
    </sc-for>
  </div>

  <button type="button" role="switch" aria-checked="{{ midiChecked }}" onClick="{{ toggleMidi }}" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-radius: 20px; background: #FFFFFF; border: none; box-shadow: 0 2px 0 #F0DCC0; font-family: inherit; color: #1F4D3A; cursor: pointer; text-align: left">
    <div style="flex: 1">
      <div style="font-weight: 800; font-size: 17px; line-height: 1.2">J'ai un clavier MIDI ou USB</div>
      <div style="font-weight: 600; font-size: 14px; color: #46655A; line-height: 1.3">Facultatif. Le micro suffit pour commencer.</div>
    </div>
    <div style="{{ trackStyle }}"><div style="{{ knobStyle }}"></div></div>
  </button>

  <div style="flex: 1"></div>

  <div style="background: #DCEBE3; border-radius: 18px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#256B47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="21"></line></svg>
    <div style="font-weight: 600; font-size: 14px; line-height: 1.4">On vérifiera ensemble que je t'entends bien, sur ton instrument et dans ta pièce.</div>
  </div>

  <a href="OnbNiveau.dc.html" style="min-height: 60px; border-radius: 20px; background: #1F4D3A; color: #FFF3E0; text-decoration: none; font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #133326">Continuer</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'piano', midi: false };
  }
  renderVals() {
    const base = [
      { id: 'piano', label: 'Piano ou clavier', hint: 'Acoustique ou numérique', icon: 'M3 5h18v14H3z M8 5v8 M12 5v8 M16 5v8 M8 13v6 M12 13v6 M16 13v6' },
      { id: 'guitare', label: 'Guitare', hint: 'Classique, folk, électrique', icon: 'M14 4l6 6 M17 7l-6 6 M11 13a4 4 0 1 1-5 5 4 4 0 0 1 5-5z M8 16l.01 0' },
    ];
    const instruments = base.map((o) => {
      const on = this.state.picked === o.id;
      return {
        ...o,
        checked: on ? 'true' : 'false',
        pick: () => this.setState({ picked: o.id }),
        style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; min-height: 128px; border-radius: 20px; font-family: inherit; color: #1F4D3A; cursor: pointer; text-align: left; ' + (on ? 'background: #FFE0CF; border: 2.5px solid #1F4D3A;' : 'background: #FFFFFF; border: 2.5px solid transparent; box-shadow: 0 2px 0 #F0DCC0;')
      };
    });
    const m = this.state.midi;
    return {
      instruments,
      midiChecked: m ? 'true' : 'false',
      toggleMidi: () => this.setState({ midi: !m }),
      trackStyle: 'width: 52px; height: 32px; border-radius: 16px; padding: 3px; box-sizing: border-box; flex-shrink: 0; display: flex; ' + (m ? 'background: #1F4D3A; justify-content: flex-end;' : 'background: #F3DFC2; justify-content: flex-start;'),
      knobStyle: 'width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2);'
    };
  }
}
</script>
</body>
</html>
