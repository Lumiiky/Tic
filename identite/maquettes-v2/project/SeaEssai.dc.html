<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Retour sur un essai</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F4D3A}a:hover{color:#133326}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF3E0; color: #1F4D3A; font-family: 'Baloo 2', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="SeaEssai.dc.html" aria-label="Quitter la séance" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #F0DCC0; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </a>
    <div style="flex: 1">
      <div style="font-weight: 800; font-size: 17px; line-height: 1.1">Thème, variation</div>
      <div style="font-weight: 600; font-size: 14px; color: #46655A">Étape 2 sur 4 · mes. 17–24 · tempo 60 %</div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 16px 18px; box-shadow: 0 2px 0 #F0DCC0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <div style="font-weight: 600; font-size: 15px; color: #46655A">Notes justes</div>
      <div style="font-weight: 800; font-size: 44px; line-height: 1; color: {{ scoreColor }}">{{ score }}</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px" role="img" aria-label="{{ barsLabel }}">
      <sc-for list="{{ measures }}" as="m" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
          <div style="width: 100%; height: 30px; border-radius: 8px; background: {{ m.bg }}; border: {{ m.border }}; box-sizing: border-box"></div>
          <span style="font-weight: 700; font-size: 12px; color: #46655A">{{ m.n }}</span>
        </div>
      </sc-for>
    </div>
    <div style="font-weight: 600; font-size: 15px; line-height: 1.35">{{ detail }}</div>
    <div style="display: flex; align-items: center; gap: 10px; border-top: 1.5px solid #F3DFC2; padding-top: 10px">
      <div style="display: flex; gap: 5px">
        <sc-for list="{{ checks }}" as="c" hint-placeholder-count="3">
          <div style="width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; background: {{ c.bg }}; border: 2.5px solid #1F4D3A"></div>
        </sc-for>
      </div>
      <div style="font-weight: 700; font-size: 15px">{{ checksLabel }}</div>
    </div>
  </div>

  <div style="flex: 1"></div>

  <sc-if value="{{ ok }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: flex-end; gap: 8px">
      <svg width="120" height="120" viewBox="0 0 200 200" role="img" aria-label="Tic épaté" style="flex-shrink: 0"><path d="M58 162 L84 42 Q 86 36 92 36 L108 36 Q 114 36 116 42 L142 162 Q 143 168 136 168 L64 168 Q 57 168 58 162 Z" fill="#FF8A5B"></path><rect x="62" y="148" width="76" height="20" rx="6" fill="#E5683A"></rect><line x1="83" y1="80" x2="96" y2="77" stroke="#1F4D3A" stroke-width="4" stroke-linecap="round"></line><line x1="104" y1="77" x2="117" y2="80" stroke="#1F4D3A" stroke-width="4" stroke-linecap="round"></line><circle cx="90" cy="95" r="8" fill="#1F4D3A"></circle><circle cx="110" cy="95" r="8" fill="#1F4D3A"></circle><circle cx="92.5" cy="92.5" r="2.5" fill="#FFF3E0"></circle><circle cx="112.5" cy="92.5" r="2.5" fill="#FFF3E0"></circle><ellipse cx="100" cy="119" rx="6" ry="8" fill="#1F4D3A"></ellipse><line x1="100" y1="148" x2="150" y2="30" stroke="#1F4D3A" stroke-width="7" stroke-linecap="round"></line><line x1="164" y1="44" x2="176" y2="36" stroke="#E5683A" stroke-width="4" stroke-linecap="round"></line><line x1="166" y1="58" x2="180" y2="58" stroke="#E5683A" stroke-width="4" stroke-linecap="round"></line><line x1="160" y1="30" x2="164" y2="18" stroke="#E5683A" stroke-width="4" stroke-linecap="round"></line></svg>
      <div style="background: #1F4D3A; color: #FFF3E0; border-radius: 20px 20px 20px 6px; padding: 12px 14px; font-weight: 700; font-size: 17px; line-height: 1.3; margin-bottom: 26px">Partie validée ! La variation est à toi.</div>
    </div>
    <a href="SeaFin.dc.html" style="min-height: 60px; border-radius: 20px; background: #1F4D3A; color: #FFF3E0; text-decoration: none; font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #133326">Étape suivante : révision</a>
  </sc-if>

  <sc-if value="{{ notOk }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: flex-end; gap: 8px">
      <svg width="120" height="120" viewBox="0 0 200 200" role="img" aria-label="Tic bienveillant" style="flex-shrink: 0"><path d="M58 162 L84 42 Q 86 36 92 36 L108 36 Q 114 36 116 42 L142 162 Q 143 168 136 168 L64 168 Q 57 168 58 162 Z" fill="#FF8A5B"></path><rect x="62" y="148" width="76" height="20" rx="6" fill="#E5683A"></rect><line x1="83" y1="86" x2="95" y2="83" stroke="#1F4D3A" stroke-width="4" stroke-linecap="round"></line><line x1="105" y1="83" x2="117" y2="86" stroke="#1F4D3A" stroke-width="4" stroke-linecap="round"></line><circle cx="90" cy="97" r="6" fill="#1F4D3A"></circle><circle cx="92.1" cy="94.9" r="2.2" fill="#FFFFFF"></circle><circle cx="110" cy="97" r="6" fill="#1F4D3A"></circle><circle cx="112.1" cy="94.9" r="2.2" fill="#FFFFFF"></circle><path d="M93 114 Q 100 119 107 114" fill="none" stroke="#1F4D3A" stroke-width="4.5" stroke-linecap="round"></path><line x1="100" y1="148" x2="146" y2="60" stroke="#1F4D3A" stroke-width="7" stroke-linecap="round"></line><path d="M162 50 c -5 -8 -16 -3 -11 6 l 11 10 l 11 -10 c 5 -9 -6 -14 -11 -6 z" fill="#E5683A"></path></svg>
      <div style="background: #FFFFFF; border-radius: 20px 20px 20px 6px; padding: 12px 14px; font-weight: 700; font-size: 17px; line-height: 1.3; box-shadow: 0 2px 0 #F0DCC0; margin-bottom: 26px">Pas grave. On ralentit un peu ?</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <a href="SeaEssai.dc.html" style="min-height: 60px; border-radius: 20px; background: #1F4D3A; color: #FFF3E0; text-decoration: none; font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #133326">Réessayer à 50 %</a>
      <a href="SeaEssai.dc.html" style="min-height: 52px; border-radius: 20px; background: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #F0DCC0">Juste les mesures 21 et 22</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"resultat":{"editor":"enum","options":["à reprendre","validé"],"default":"à reprendre"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = (this.props.resultat ?? 'à reprendre') === 'validé';
    const miss = ok ? [] : [5, 6];
    const measures = [17, 18, 19, 20, 21, 22, 23, 24].map((n, i) => {
      const bad = miss.indexOf(i + 1) >= 0 && i >= 4;
      return {
        n,
        bg: bad ? '#FFE0CF' : '#DCEBE3',
        border: bad ? '2.5px dashed #A63E17' : '2.5px solid #256B47'
      };
    });
    const filled = ok ? 3 : 2;
    const checks = [0, 1, 2].map((i) => ({ bg: i < filled ? '#1F4D3A' : 'transparent' }));
    return {
      ok,
      notOk: !ok,
      score: ok ? '88 %' : '71 %',
      scoreColor: ok ? '#256B47' : '#A63E17',
      measures,
      barsLabel: ok ? 'Toutes les mesures sont justes' : 'Mesures 21 et 22 à reprendre',
      detail: ok ? 'Tout est en place, même le passage de la mesure 21.' : 'Mesures 21 et 22 : le sol de la main droite arrive un peu tôt.',
      checks,
      checksLabel: ok ? '3 essais réussis sur 3 : validée' : '2 essais réussis sur 3 · il en faut 3 à 80 %'
    };
  }
}
</script>
</body>
</html>
