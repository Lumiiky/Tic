<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Où tu en es</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F4D3A}a:hover{color:#133326}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF3E0; color: #1F4D3A; font-family: 'Baloo 2', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="OnbBienvenue.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #F0DCC0; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px" role="img" aria-label="Étape 1 sur 6">
      <div style="height: 8px; border-radius: 4px; background: #FF8A5B"></div><div style="height: 8px; border-radius: 4px; background: #F3DFC2"></div><div style="height: 8px; border-radius: 4px; background: #F3DFC2"></div><div style="height: 8px; border-radius: 4px; background: #F3DFC2"></div><div style="height: 8px; border-radius: 4px; background: #F3DFC2"></div><div style="height: 8px; border-radius: 4px; background: #F3DFC2"></div>
    </div>
  </div>

  <div>
    <h1 style="margin: 0; font-weight: 800; font-size: 32px; line-height: 1.08">Où tu en es avec la musique ?</h1>
    <div style="font-size: 16px; font-weight: 600; color: #46655A; margin-top: 4px">Ça règle la taille des parties et le tempo de départ.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px" role="radiogroup" aria-label="Ton profil">
    <sc-for list="{{ options }}" as="opt" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{ opt.checked }}" onClick="{{ opt.pick }}" style="{{ opt.style }}">
        <div style="{{ opt.dot }}"></div>
        <div style="flex: 1; text-align: left">
          <div style="font-weight: 800; font-size: 18px; line-height: 1.2">{{ opt.label }}</div>
          <div style="font-weight: 600; font-size: 14px; color: #46655A; line-height: 1.3">{{ opt.hint }}</div>
        </div>
      </button>
    </sc-for>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; align-items: flex-end; gap: 8px">
    <svg width="72" height="72" viewBox="0 0 200 200" role="img" aria-label="Tic, curieux" style="flex-shrink: 0"><path d="M58 162 L84 42 Q 86 36 92 36 L108 36 Q 114 36 116 42 L142 162 Q 143 168 136 168 L64 168 Q 57 168 58 162 Z" fill="#FF8A5B"></path><rect x="62" y="148" width="76" height="20" rx="6" fill="#E5683A"></rect><line x1="104" y1="80" x2="118" y2="76" stroke="#1F4D3A" stroke-width="5" stroke-linecap="round"></line><circle cx="90" cy="97" r="6" fill="#1F4D3A"></circle><circle cx="92.1" cy="94.9" r="2.2" fill="#FFFFFF"></circle><circle cx="110" cy="95" r="8" fill="#1F4D3A"></circle><circle cx="112.8" cy="92.2" r="3" fill="#FFFFFF"></circle><path d="M92 116 Q 101 120 109 113" fill="none" stroke="#1F4D3A" stroke-width="5" stroke-linecap="round"></path><line x1="100" y1="148" x2="156" y2="62" stroke="#1F4D3A" stroke-width="8" stroke-linecap="round"></line></svg>
    <div style="background: #FFFFFF; border-radius: 20px 20px 20px 6px; padding: 10px 14px; font-weight: 600; font-size: 15px; line-height: 1.35; box-shadow: 0 2px 0 #F0DCC0; margin-bottom: 14px">Aucune mauvaise réponse. Tu pourras changer plus tard.</div>
  </div>

  <a href="OnbInstrument.dc.html" style="min-height: 60px; border-radius: 20px; background: #1F4D3A; color: #FFF3E0; text-decoration: none; font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #133326">Continuer</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'reprise' };
  }
  renderVals() {
    const base = [
      { id: 'debut', label: 'Je débute', hint: 'Jamais ou presque jamais joué' },
      { id: 'reprise', label: 'Je reprends', hint: "J'ai joué il y a quelques années" },
      { id: 'motiv', label: 'Je joue, mais je décroche', hint: "Il me manque un but pour m'y remettre" },
      { id: 'cours', label: 'Je prends des cours', hint: 'Je veux un appui entre deux leçons' }
    ];
    const options = base.map((o) => {
      const on = this.state.picked === o.id;
      return {
        ...o,
        checked: on ? 'true' : 'false',
        pick: () => this.setState({ picked: o.id }),
        style: 'display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border-radius: 20px; font-family: inherit; color: #1F4D3A; cursor: pointer; ' + (on ? 'background: #FFE0CF; border: 2.5px solid #1F4D3A;' : 'background: #FFFFFF; border: 2.5px solid transparent; box-shadow: 0 2px 0 #F0DCC0;'),
        dot: 'width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; flex-shrink: 0; ' + (on ? 'border: 7px solid #1F4D3A; background: #FFFFFF;' : 'border: 2.5px solid #46655A;')
      };
    });
    return { options };
  }
}
</script>
</body>
</html>
